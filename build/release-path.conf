# The release path switch (#258): recipes the rc channel releases from the release workflow
# (.github/workflows/release.yml, then bin/release-sign) instead of the build host's chroot.
#
#   <recipe>
#
# One recipe directory name per line; # starts a comment. Listing a recipe means the daily
# rebase onto upstream no longer builds it in the chroot: its PR check builds it, and after the
# merge the release workflow builds it on main and bin/release-sign checks that run and hands
# the packages to bin/publish. It applies only to the rc channel from main; anywhere else, and
# while this file lists nothing, every recipe builds in the chroot as before.
#
# A recipe is listed only after bin/compare-build-paths has passed for it: a release workflow
# run of it on main compared against what the rc release serves (docs/releases.md "Switching a
# recipe to the release path"), named in the pull request that lists it. linux-omarchy also
# needs the build host's release runner (docs/kernel-runner.md "The release registration")
# and the RELEASE_RUNNER variable naming it. The members of a release cohort
# (build/cohorts.conf) are listed together or not at all.
#
# omarchy-asus-keyring is the first, alone: one small package on the rc channel before the
# others follow.
omarchy-asus-keyring
