# Fast ring: packages published to every channel at once instead of being promoted ring by
# ring (rc -> quattro). Not in use yet (#309): nothing reads this file but bin/env.sh's
# fast_ring_packages and its test.
#
#   <pkgname>  <reason>
#
# One package per line: its name, whitespace, then why it may skip promotion (required).
# A package belongs here only if it is arch=any, has no upstream base and is safe on every
# channel as built.

omarchy-asus-keyring  arch=any, no upstream base; must reach every machine before a key rotation
