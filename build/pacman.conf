# Chroot pacman.conf: the same package sources the laptop uses (Omarchy stable
# snapshot of Arch + [omarchy] listed above core), so packages are built
# against exactly what they will be installed next to.
[options]
HoldPkg     = pacman glibc
Architecture = auto
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

[omarchy]
Server = https://pkgs.omarchy.org/stable/$arch

[core]
Server = https://stable-mirror.omarchy.org/$repo/os/$arch

[extra]
Server = https://stable-mirror.omarchy.org/$repo/os/$arch

[multilib]
Server = https://stable-mirror.omarchy.org/$repo/os/$arch
