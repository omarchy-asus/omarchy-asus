# Chroot pacman.conf for the RC channel (bin/env.sh, --channel rc): the package sources a
# laptop on Omarchy's rc channel uses (Omarchy's rc snapshot of Arch, rc-mirror, + its rc
# [omarchy] listed above core, as in Omarchy's default/pacman/pacman-rc.conf and
# mirrorlist-rc), so RC packages are built against exactly what they will be installed next to.
[options]
HoldPkg     = pacman glibc
Architecture = auto
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

[omarchy]
Server = https://pkgs.omarchy.org/rc/$arch

[core]
Server = https://rc-mirror.omarchy.org/$repo/os/$arch

[extra]
Server = https://rc-mirror.omarchy.org/$repo/os/$arch

[multilib]
Server = https://rc-mirror.omarchy.org/$repo/os/$arch
