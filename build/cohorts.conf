# Release cohorts: recipes whose packages must be built, published and withdrawn together
# (bin/release-cohort, bin/publish, bin/unpublish, bin/auto-update, bin/check-upstream).
#
#   <recipe> <recipe> [<recipe>...]
#
# One cohort per line, whitespace-separated recipe directory names. Each recipe builds one
# package with the recipe's name, and all members carry the same pkgver-pkgrel.

# #83: the patched omarchy's first-run and migrations enable units (the charger-swap
# monitor) that only the patched omarchy-settings ships; stock settings of the same
# pkgver lacks them.
omarchy omarchy-settings
