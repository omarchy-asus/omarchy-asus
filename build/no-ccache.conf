#!/hint/bash
# bin/build-pkg mounts this read-only at /etc/makepkg.conf.d/zz-no-ccache.conf when it
# mounts no compiler cache at /ccache (CCACHE_HOST_DIR= or no cache dir). It loads after
# the chroot's own ccache.conf and turns ccache off in BUILDENV: with ccache on and
# nothing at /ccache, every compile fails "Permission denied" (#237). distcc, when on,
# stays on.
BUILDENV=("${BUILDENV[@]/#ccache/!ccache}")
