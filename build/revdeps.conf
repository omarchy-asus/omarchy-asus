# Reverse dependencies that bin/auto-update compiles in a throwaway chroot (bin/revdep-check)
# before it publishes anything.
#
#   <kernel recipe>  dkms:<dkms recipe>  [headers=<headers pkgname>]
#
# - When the kernel recipe is rebuilt, each listed DKMS package is compiled against the
#   freshly built headers. The DKMS package is the one in our repo, or the staged build of
#   its recipe's version. If the module does not build, the kernel is not published: a
#   rebase PR stays open and the stale kernel is unpublished.
# - When a DKMS recipe is rebuilt, it is compiled against the headers of the kernel we
#   publish, or the stock headers package from [omarchy] if our repo has no kernel build.
#   If that fails, the DKMS package is not published.
# The headers package defaults to <kernel recipe>-headers. The DKMS recipe's package must
# have the recipe's name.
linux-omarchy  dkms:nvidia-open-dkms  headers=linux-omarchy-headers
