# SPDX-License-Identifier: MIT
#
# g16-mic-aec.conf: echo cancellation ONLY for the processed G16
# microphone, using PipeWire's own module-echo-cancel with its WebRTC
# backend (aec/libspa-aec-webrtc, which links webrtc-audio-processing-1).
# This is the default, preserve-words fragment: it removes the echo of what
# this machine plays and leaves everything else, background noise included,
# in the signal. g16-mic writes no suppressor and no gain control of its own.
#
# OFF UNTIL YOU LINK IT. The package installs this file under
# /usr/share/omarchy-asus-g16-mic/pipewire/, which PipeWire does not read.
# Nothing here changes the default source: the new node has
# priority.session = 0, and you pick it in an app or with wpctl yourself.
#
# Chain:
#   G16 mic array
#     -> g16-mic (calibration, omni / beam / track)
#     -> node g16_mic_processed (mono)
#     -> module-echo-cancel, WebRTC backend:
#          echo canceller, reference = the default sink's monitor
#          no noise suppressor (webrtc.noise_suppression = false)
#          no gain control (webrtc.gain_control = false)
#     -> new source node g16_mic_clean (mono)
#
# Echo reference: monitor.mode = true makes the module capture the monitor
# ports of the DEFAULT SINK instead of creating a sink of its own. The
# reference therefore follows whichever sink is the default. Sound that this
# machine does not play through its default sink (another device, a TV, a
# second sink an app picked) is not in the reference and is not cancelled.
#
# Why noise suppression is off: PipeWire 1.6's aec-webrtc.cpp, when
# webrtc.noise_suppression is on, fixes the level in its source
# (NoiseSuppression::kHigh for webrtc-audio-processing 1.x) and reads no key
# to lower it. Suppression that strong can remove quiet or trailing words
# along with the noise. This default keeps every word and leaves the noise
# in. If you want suppression anyway, the separate opt-in fragment
# g16-mic-aec-ns-high.conf (same directory) adds it, with its own node
# names; check it on the G16 before relying on it. Link one of the two, not
# both: both would capture g16_mic_processed and run two echo cancellers.
#
# High-pass: g16-mic already high-passes each channel, so
# webrtc.high_pass_filter is off. The library's echo canceller still applies
# its own high-pass while it is enabled (EchoCanceller
# enforce_high_pass_filtering, not configurable from PipeWire).
#
# Delay: in this module PipeWire passes the library a delay hint of
# (blocks per buffer - 1) * 10 ms; the WebRTC echo canceller (AEC3) finds the
# real speaker-to-mic delay itself. Older keys webrtc.extended_filter and
# webrtc.delay_agnostic are read only for webrtc-audio-processing 0.x and are
# left out on purpose.
#
# Keys: only those PipeWire 1.6 parses for webrtc-audio-processing 1.x:
# webrtc.high_pass_filter, webrtc.noise_suppression, webrtc.gain_control,
# webrtc.voice_detection, webrtc.transient_suppression, webrtc.mobile_mode.
# test_aec checks this file against that list and runs the library with the
# same settings (echo return loss and near-end speech retention during
# double talk).
#
# Opt in (as your user):
#   mkdir -p ~/.config/pipewire/pipewire.conf.d
#   ln -s /usr/share/omarchy-asus-g16-mic/pipewire/g16-mic-aec.conf \
#         ~/.config/pipewire/pipewire.conf.d/g16-mic-aec.conf
#   systemctl --user restart pipewire pipewire-pulse wireplumber
# g16_mic_clean appears once g16-mic is running and g16_mic_processed exists.
#
# Undo, exactly:
#   rm ~/.config/pipewire/pipewire.conf.d/g16-mic-aec.conf
#   systemctl --user restart pipewire pipewire-pulse wireplumber

context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            # Capture the default sink's monitor as the echo reference.
            monitor.mode = true
            node.latency = 480/48000
            # Mono throughout; the module's default would be stereo.
            audio.channels = 1
            audio.position = [ MONO ]
            aec.args = {
                webrtc.gain_control = false
                # Off: keeps quiet and trailing words (see above).
                webrtc.noise_suppression = false
                webrtc.high_pass_filter = false
                webrtc.voice_detection = false
                webrtc.transient_suppression = false
                webrtc.mobile_mode = false
            }
            capture.props = {
                node.name = "g16_mic_aec_capture"
                node.description = "G16 mic echo-cancel input"
                # Only ever the processed G16 mic, never another source.
                target.object = "g16_mic_processed"
                node.dont-fallback = true
                node.passive = true
            }
            sink.props = {
                # In monitor.mode this is the stream that records the
                # default sink's monitor (the echo reference).
                node.name = "g16_mic_aec_reference"
                node.description = "G16 mic echo-cancel reference"
            }
            source.props = {
                node.name = "g16_mic_clean"
                node.description = "G16 mic (processed + echo cancel)"
                # Never chosen as the default source by itself.
                priority.session = 0
            }
        }
    }
]
