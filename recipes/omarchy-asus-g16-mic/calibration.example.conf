# SPDX-License-Identifier: MIT
# g16-mic calibration and geometry file (example).
#
# Copy it, edit the copy and point g16-mic at it (README.md says how).
# Syntax: key=value, one per line, at most 512 bytes a line.
# '#' starts a comment only at the start of a line (no comments after a
# value). Whitespace around keys, values and list items is ignored. Unknown or
# repeated keys are errors, and so is any number that is NaN or infinite.
# Lists are comma separated and have exactly `channels` items, mic 0 first.
#
# THIS FILE IS NOT A CALIBRATION OF THE G16. Its mic positions below are
# illustrative, not measured. With verified=false the spatial modes (beam,
# track) stay UNAVAILABLE and refuse to start; raw and omni still work, and
# omni ignores this file's gains, polarities and delays until it is verified.
# Only a file measured on the hardware, with verified=true, a recent
# measured= date and a matching kernel= and layout=, turns them on.

# File format version. Required; only 1 exists.
format=1

# Mics described by this file, 1..8. Required. Must equal the channel count of
# the captured stream before the spatial modes run.
channels=2

# Sample rate the measurements were made at. Only 48000 is supported.
rate=48000

# The captured stream this file belongs to: "<node.name>/<N>ch", exactly as
# `g16-mic status` prints it. The spatial modes need an exact match.
layout=alsa_input.pci-0000_65_00.6.analog-stereo/2ch

# Kernel release the layout was measured on, as a prefix that ends at a
# version boundary: 7.2 matches 7.2.8-9-omarchy but not 7.20.1. A kernel
# change can renumber or reorder capture channels, so measure again.
kernel=7.2

# Date of the measurement, YYYY-MM-DD (UTC). Spatial modes refuse a date in
# the future or one older than max_age_days.
measured=2026-11-01

# How long a measurement stays valid, 1..3650 days.
max_age_days=365

# true only once the positions, delays and gains below were measured on this
# machine and checked. false keeps the spatial modes UNAVAILABLE.
verified=false

# Stream channel that feeds each mic (0..7, no repeats).
map=0,1

# Per-mic gain correction in dB, -40..40, applied before any mode but raw.
gain_db=0,0

# Per-mic polarity, 1 or -1 (-1 flips a mic that is wired inverted).
polarity=1,1

# Per-mic delay correction in samples at 48 kHz, 0..32, fractional allowed.
# Aligns mics whose capture paths have different latency.
delay=0,0

# High-pass corner in Hz, 0..500; 0 turns it off.
hpf_hz=80

# DC blocker before the high-pass: 1 on, 0 off.
dc_block=1

# Mic positions: mic.N=x,y,z in metres, |value| <= 1. Give every mic.N or
# none. Axes: x along the lid edge, left to right as seen by the user; y
# toward the user; z up. The spatial modes need at least two mics more than
# 1 mm apart and an aperture (largest spacing) of at least 5 mm.
# ILLUSTRATIVE ONLY, NOT THE G16'S MEASURED POSITIONS:
mic.0=-0.035,0,0
mic.1=0.035,0,0
