#
# g16-mic-aec-ns-high.conf: echo cancellation PLUS noise suppression at
# PipeWire's fixed high level for the processed G16 microphone, using
# PipeWire's own module-echo-cancel with its WebRTC backend
# (aec/libspa-aec-webrtc, which links webrtc-audio-processing-1).
#
# OPT-IN, WORD-LOSS RISK: noise suppression at PipeWire's fixed high level
# can drop quiet or trailing speech; check it on the G16 (speak quietly,
# trail off, talk over playback) before using it for anything that matters.
# The default, g16-mic-aec.conf in the same directory, is echo cancellation
# only and keeps every word; prefer it unless the noise is the problem.
#
# OFF UNTIL YOU LINK IT. The package installs this file under
# /usr/share/omarchy-asus-g16-mic/pipewire/, which PipeWire does not read.
# Nothing here changes the default source: the new node has
# priority.session = 0, and you pick it in an app or with wpctl yourself.
# Its node names differ from the default fragment's, so the two never
# collide; still, link one of the two, not both (both would capture
# g16_mic_processed and run two echo cancellers).
#
# Chain:
#   G16 mic array
#     -> g16-mic (calibration, omni / beam / track)
#     -> node g16_mic_processed (mono)
#     -> module-echo-cancel, WebRTC backend:
#          echo canceller, reference = the default sink's monitor
#          noise suppressor, high (webrtc.noise_suppression = true)
#          no gain control (webrtc.gain_control = false)
#     -> new source node g16_mic_clean_ns (mono)
#
# Echo reference: monitor.mode = true makes the module capture the monitor
# ports of the DEFAULT SINK instead of creating a sink of its own. The
# reference therefore follows whichever sink is the default. Sound that this
# machine does not play through its default sink (another device, a TV, a
# second sink an app picked) is not in the reference and is not cancelled.
#
# Noise suppression level: PipeWire 1.6's aec-webrtc.cpp fixes it in its
# source (NoiseSuppression::kHigh for webrtc-audio-processing 1.x) and reads
# no key to lower it. It is the single suppression stage in this chain:
# g16-mic adds none. test_aec runs the library with these settings and
# reports how much near-end speech they keep next to the default's.
#
# High-pass: g16-mic already high-passes each channel, so
# webrtc.high_pass_filter is off. The library's echo canceller still applies
# its own high-pass while it is enabled (EchoCanceller
# enforce_high_pass_filtering, not configurable from PipeWire).
#
# Keys: only those PipeWire 1.6 parses for webrtc-audio-processing 1.x:
# webrtc.high_pass_filter, webrtc.noise_suppression, webrtc.gain_control,
# webrtc.voice_detection, webrtc.transient_suppression, webrtc.mobile_mode.
#
# Opt in (as your user):
#   mkdir -p ~/.config/pipewire/pipewire.conf.d
#   ln -s /usr/share/omarchy-asus-g16-mic/pipewire/g16-mic-aec-ns-high.conf \
#         ~/.config/pipewire/pipewire.conf.d/g16-mic-aec-ns-high.conf
#   systemctl --user restart pipewire pipewire-pulse wireplumber
# g16_mic_clean_ns appears once g16-mic is running and g16_mic_processed
# exists.
#
# Undo, exactly:
#   rm ~/.config/pipewire/pipewire.conf.d/g16-mic-aec-ns-high.conf
#   systemctl --user restart pipewire pipewire-pulse wireplumber

context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            # Capture the default sink's monitor as the echo reference.
            monitor.mode = true
            node.latency = 480/48000
            # Mono throughout; the module's default would be stereo.
            audio.channels = 1
            audio.position = [ MONO ]
            aec.args = {
                webrtc.gain_control = false
                # On, at PipeWire's fixed high level: word-loss risk.
                webrtc.noise_suppression = true
                webrtc.high_pass_filter = false
                webrtc.voice_detection = false
                webrtc.transient_suppression = false
                webrtc.mobile_mode = false
            }
            capture.props = {
                node.name = "g16_mic_aec_ns_capture"
                node.description = "G16 mic echo-cancel + noise suppression input"
                # Only ever the processed G16 mic, never another source.
                target.object = "g16_mic_processed"
                node.dont-fallback = true
                node.passive = true
            }
            sink.props = {
                # In monitor.mode this is the stream that records the
                # default sink's monitor (the echo reference).
                node.name = "g16_mic_aec_ns_reference"
                node.description = "G16 mic echo-cancel + noise suppression reference"
            }
            source.props = {
                node.name = "g16_mic_clean_ns"
                node.description = "G16 mic (processed + echo cancel + noise suppression high)"
                # Never chosen as the default source by itself.
                priority.session = 0
            }
        }
    }
]
