# omarchy-asus-g16: suspend and resume devices one at a time (#397).
#
# On the G16's Krackan APU (Ryzen AI 7 350), restoring a hibernation image can
# end in a data fabric sync flood: the whole SoC resets and the next boot logs
# "Previous system reset reason [0x08000800]". It hit the G16 on 2026-10-19 and
# 2026-10-22, on our kernel and on stock linux-omarchy alike. A Framework 13
# with the same APU reports the same reset at about one restore in seven, gone
# with pm_async off. pm_async=off is read by the kernel that boots to load the
# image and is saved in the image, so the restored kernel resumes devices
# serially too. Suspend and resume take a little longer. Read by
# limine-entry-tool from its vendor directory (lowest priority);
# /etc/limine-entry-tool.d and /etc/default/limine still apply after it.
KERNEL_CMDLINE[default]+=" pm_async=off"
