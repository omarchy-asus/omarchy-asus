# The G16's MediaTek MT7925 (mt7925e) times out its first WPA four-way
# handshake after a wake, and on most cold boots; the next try connects.
# NetworkManager counts each timeout against connection.auth-retries (3 by
# default) and, once they run out, asks a secret agent for a new key. Omarchy
# runs no secret agent, so the connection fails (no-secrets) and autoconnect
# leaves it down. More tries, for this driver only: a wrong password still
# fails, after six.
[connection-omarchy-asus-g16-mt7925]
match-device=driver:mt7925e
connection.auth-retries=6
