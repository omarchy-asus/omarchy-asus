[Unit]
# nvidia-utils caps nvidia-powerd at five starts per boot (an infinite window)
# to stop a crash loop. asusd starts it on every charger plug-in and stops it on
# every unplug, so the sixth plug-in of a boot leaves Dynamic Boost off until
# reboot. A one-minute window still stops a crash loop (Restart=on-failure every
# 10 s reaches five starts in 40 s) without counting plug-ins hours apart.
StartLimitIntervalSec=60
