# omarchy-asus-g16: offload RCU callbacks from every CPU (#229).
#
# linux-omarchy has lazy RCU built in and on, but it only batches callbacks on
# offloaded CPUs, and none are without rcu_nocbs=. Offloaded, an idle CPU no
# longer keeps its 1000 Hz tick running while it has callbacks queued, and
# non-urgent callbacks wait up to 10 s in the rcuo kthreads instead of waking
# CPUs. Read by limine-entry-tool from its vendor directory (lowest priority);
# /etc/limine-entry-tool.d and /etc/default/limine still apply after it.
KERNEL_CMDLINE[default]+=" rcu_nocbs=all"
