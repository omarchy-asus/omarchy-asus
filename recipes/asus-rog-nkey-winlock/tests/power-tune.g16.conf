# Settings applied when the machine moves between AC and battery.
# Edit and then: systemctl --user restart power-tune

# Internal panel. The external monitor is deliberately left alone: it is
# configured in ~/.config/hypr/monitors.lua and is not on battery power.
# Matched by description: this panel enumerates as eDP-1 or eDP-2 depending on
# the boot. A plain connector name here silently disables refresh switching.
INTERNAL_OUTPUT="desc:Samsung Display Corp. ATNA60DL04-0"

# Refresh rate, in Hz, per power source.
# 240 on AC, 60 on battery. The gaming toggle still forces 240 on battery:
# `omarchy-power-tune gaming on`.
HZ_AC=240
HZ_BATTERY=60
HZ_GAMING=240

# Keyboard backlight: off, low, med, high
KBD_AC=med
KBD_BATTERY=med

# Panel overdrive: 1 on, 0 off. Minor on an OLED, but free.
PANEL_OVERDRIVE_AC=0
PANEL_OVERDRIVE_BATTERY=0

# bitdepth is MANDATORY on the internal panel and must stay 10. Without it amdgpu rejects
# the atomic commit with ENOMEM and the panel goes black at every resolution.
# See the comment block in ~/.config/hypr/monitors.lua.
BITDEPTH=10

# power-tune follows UPower itself (rog-power retired 2026-10-20)
UPOWER_EVENTS=1
POLL_SECS=0
HYPR_EVENTS=1

# Backlight: on leaving the barrel drop to this % if brighter (once, not a cap);
# the barrel level comes back on replug unless you went brighter meanwhile. Empty = off.
BRIGHT_BATTERY=30
