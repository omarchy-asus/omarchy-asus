<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- g16-winlockd: only root owns the name; anyone may call it. SetLocked is
     checked again in the service (root, or polkit io.github.omarchy-asus.winlock.set-locked). -->
<busconfig>
  <policy user="root">
    <allow own="io.github.omarchy_asus.WinLock1"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.omarchy_asus.WinLock1"/>
  </policy>
</busconfig>
