name: Build changed packages

# Build every recipe a PR touches, one job per recipe, in a stock Arch
# container set up with the production package sources of the channel the PR
# targets (ci/channel: a PR into next/omarchy-4.5 builds against Omarchy rc,
# build/pacman-rc.conf; any other against Omarchy stable, build/pacman.conf)
# and the devtools makepkg.conf. Shaped after omarchy-pkgs' build-pr.yml
# (changes -> build matrix -> result).
#
# Artifacts are UNSIGNED and short-lived; they exist for review and for the
# NVIDIA check below. Signing and publishing stay on the maintainer's machine
# (bin/build-pkg -> bin/publish -> bin/sync-release): no workflow here holds
# a key or a secret, and the token is read-only.
#
# ci/changed-recipes has the planning rules. linux-omarchy has its own job
# (big disk, long timeout); when it or nvidia-open-dkms builds, nvidia-compat
# compiles our NVIDIA module against our kernel headers with dkms, taking
# whichever side this run did not build from the signed x86_64 release.
#
# No paths filter: `result` reports on every PR (a PR without recipe changes
# plans an empty matrix and passes in seconds).
#
# Reuse (as omarchy-pkgs does): each build uploads its packages as
# pkgs-<recipe>-<hash>, where the hash covers the recipe's git tree and the
# builder inputs (ci/find-build has the list). Before building, a job looks
# for an unexpired artifact with its label from an earlier run on this repo;
# if there is one, it downloads and re-uploads those packages instead of
# building, so a push that leaves a recipe alone doesn't rebuild it, and
# nvidia-compat still runs against them. Dispatch with rebuild=true to force.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      recipes:
        description: "Space-separated recipe directories to build (e.g. hyprland). linux-omarchy takes hours."
        required: false
        default: ""
      rebuild:
        description: "Build even when an earlier run already built the same recipe tree."
        type: boolean
        default: false

concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILDER_IMAGE: ghcr.io/archlinux/archlinux:base-devel
  FORCE_BUILD: ${{ github.event.inputs.rebuild || 'false' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      recipes: ${{ steps.plan.outputs.recipes }}
      kernel: ${{ steps.plan.outputs.kernel }}
      nvidia_built: ${{ steps.plan.outputs.nvidia_built }}
      nvidia_compat: ${{ steps.plan.outputs.nvidia_compat }}
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The release channel is the target branch's (README.md "Release channels").
      - id: channel
        env:
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail
          echo "channel=$(ci/channel "$BRANCH")" | tee -a "$GITHUB_OUTPUT"
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ github.event.inputs.recipes }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ $EVENT == workflow_dispatch ]]; then
            ci/changed-recipes --list "$REQUESTED" | tee -a "$GITHUB_OUTPUT"
          else
            ci/changed-recipes "$BASE_SHA" "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"
          fi
          {
            echo "### Build plan"
            echo
            sed 's/^/- /' "$GITHUB_OUTPUT" | grep -E '^- (channel|recipes|kernel|nvidia_compat)='
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: changes
    if: needs.changes.outputs.recipes != '[]'
    name: build (${{ matrix.recipe }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read # find and download an earlier run's build (ci/find-build)
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.changes.outputs.recipes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look for an earlier build of this tree
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          RECIPE: ${{ matrix.recipe }}
          CHANNEL: ${{ needs.changes.outputs.channel }}
        run: ci/find-build "$RECIPE" | tee -a "$GITHUB_OUTPUT"
      - name: Reuse ${{ matrix.recipe }} from run ${{ steps.prev.outputs.run_id }}
        if: steps.prev.outputs.run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.prev.outputs.label }}
          path: out
          run-id: ${{ steps.prev.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Reused ${{ matrix.recipe }}
        if: steps.prev.outputs.run_id != ''
        env:
          RECIPE: ${{ matrix.recipe }}
          RUN_ID: ${{ steps.prev.outputs.run_id }}
          LABEL: ${{ steps.prev.outputs.label }}
        run: |
          set -euo pipefail
          ls -l out
          { echo "### $RECIPE (not rebuilt)"; echo
            echo "Same tree ($LABEL) already built by run [$RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID); reusing its packages."
            echo; echo '```'; (cd out && ls -l -- *.pkg.tar.zst); echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # No -e/--env, no docker socket: the container holds no credentials
      # (ci/build-recipe header, tests/ci/build-recipe-no-secrets.sh).
      - name: Build ${{ matrix.recipe }}
        if: steps.prev.outputs.run_id == ''
        env:
          RECIPE: ${{ matrix.recipe }}
          CHANNEL: ${{ needs.changes.outputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm -v "$PWD:/repo:ro" -v "$PWD/out:/out" "$BUILDER_IMAGE" /repo/ci/build-recipe --channel "$CHANNEL" "$RECIPE"
          ls -l out
          { echo "### $RECIPE"; echo; echo '```'; (cd out && ls -l -- *.pkg.tar.zst); echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # -debug packages (devtools makepkg.conf enables debug) are not
      # published and are large (hyprland-debug ~120 MB): left out.
      # A reused build is uploaded again under the same label: nvidia-compat
      # finds it in this run, and the label stays alive for the next push.
      - name: Upload packages (unsigned)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.prev.outputs.label }}
          path: |
            out/*.pkg.tar.zst
            !out/*-debug-*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  kernel:
    needs: changes
    if: needs.changes.outputs.kernel == 'true'
    name: build (linux-omarchy)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
      actions: read # find and download an earlier run's build (ci/find-build)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look for an earlier build of this tree
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          CHANNEL: ${{ needs.changes.outputs.channel }}
        run: ci/find-build linux-omarchy | tee -a "$GITHUB_OUTPUT"
      # The kernel tree, its objects and the packages need ~30 GB; a stock
      # runner has ~20 GB free on /. Drop the preinstalled toolchains we never
      # use (no third-party action) and build on whichever disk is bigger.
      # A reused build needs none of that.
      - name: Free disk space
        if: steps.prev.outputs.run_id == ''
        run: |
          df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules /opt/microsoft /opt/google
          docker image prune --all --force >/dev/null
          df -h / /mnt || true
      - name: Pick the build disk
        if: steps.prev.outputs.run_id == ''
        id: disk
        run: |
          root=$(df --output=avail -B1 / | tail -1)
          mnt=$(df --output=avail -B1 /mnt 2>/dev/null | tail -1 || echo 0)
          if (( ${mnt:-0} > root )); then dir=/mnt/omarchy-asus-build; else dir=$RUNNER_TEMP/omarchy-asus-build; fi
          sudo mkdir -p "$dir/work" "$dir/out"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "building in $dir ($(df -h --output=avail "$dir" | tail -1) free), $(nproc) CPUs, $(free -g | awk '/Mem/{print $2}') GB RAM"
      - name: Reuse linux-omarchy from run ${{ steps.prev.outputs.run_id }}
        if: steps.prev.outputs.run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.prev.outputs.label }}
          path: ${{ runner.temp }}/omarchy-asus-build/out
          run-id: ${{ steps.prev.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Reused linux-omarchy
        if: steps.prev.outputs.run_id != ''
        env:
          RUN_ID: ${{ steps.prev.outputs.run_id }}
          LABEL: ${{ steps.prev.outputs.label }}
          DIR: ${{ runner.temp }}/omarchy-asus-build
        run: |
          set -euo pipefail
          ls -l "$DIR/out"
          { echo "### linux-omarchy (not rebuilt)"; echo
            echo "Same tree ($LABEL) already built by run [$RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID); reusing its packages."
            echo; echo '```'; ls -l "$DIR/out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # No -e/--env, no docker socket: the container holds no credentials
      # (ci/build-recipe header, tests/ci/build-recipe-no-secrets.sh).
      - name: Build linux-omarchy
        if: steps.prev.outputs.run_id == ''
        env:
          DIR: ${{ steps.disk.outputs.dir }}
          CHANNEL: ${{ needs.changes.outputs.channel }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo:ro" -v "$DIR/out:/out" -v "$DIR/work:/build" \
            "$BUILDER_IMAGE" /repo/ci/build-recipe --channel "$CHANNEL" linux-omarchy
          ls -l "$DIR/out"
          { echo "### linux-omarchy"; echo; echo '```'; ls -l "$DIR/out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # ~260 MB (kernel + headers); kept a week, so the next push to a kernel
      # PR within that time reuses it instead of building for 2.5 hours (a
      # reuse uploads it again, which restarts the week).
      - name: Upload packages (unsigned)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.prev.outputs.label }}
          path: ${{ steps.disk.outputs.dir || format('{0}/omarchy-asus-build', runner.temp) }}/out/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  nvidia-compat:
    needs: [changes, build, kernel]
    # Runs when either side changed and neither of this run's builds failed.
    if: >-
      !cancelled() && needs.changes.outputs.nvidia_compat == 'true' &&
      needs.build.result != 'failure' && needs.kernel.result != 'failure'
    name: nvidia-open-dkms vs linux-omarchy-headers
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Built or reused by this run (the label ends in a tree hash). The
      # pattern can't match another recipe's artifact: no other recipe's
      # name starts with linux-omarchy- or nvidia-open-dkms-.
      - name: Fetch linux-omarchy from this run
        if: needs.changes.outputs.kernel == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pkgs-linux-omarchy-*
          merge-multiple: true
          path: pkgs
      - name: Fetch nvidia-open-dkms from this run
        if: needs.changes.outputs.nvidia_built == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pkgs-nvidia-open-dkms-*
          merge-multiple: true
          path: pkgs
      # Against the channel the PR targets: its package sources, and its release
      # for the side this run did not build.
      - name: dkms build nvidia against linux-omarchy-headers
        env:
          CHANNEL: ${{ needs.changes.outputs.channel }}
        run: |
          mkdir -p pkgs && ls -l pkgs
          docker run --rm -v "$PWD:/repo:ro" -v "$PWD/pkgs:/pkgs:ro" "$BUILDER_IMAGE" /repo/ci/nvidia-compat --channel "$CHANNEL" /pkgs

  # One stable check name for branch protection, as in omarchy-pkgs.
  result:
    needs: [changes, build, kernel, nvidia-compat]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
          KERNEL: ${{ needs.kernel.result }}
          NVIDIA: ${{ needs.nvidia-compat.result }}
          RECIPES: ${{ needs.changes.outputs.recipes }}
        run: |
          echo "changes=$CHANGES build=$BUILD kernel=$KERNEL nvidia-compat=$NVIDIA recipes=$RECIPES"
          [[ $CHANGES == success ]] || { echo "::error::build planning failed"; exit 1; }
          for r in "$BUILD" "$KERNEL" "$NVIDIA"; do
            [[ $r == success || $r == skipped ]] || { echo "::error::a build or check did not pass"; exit 1; }
          done
