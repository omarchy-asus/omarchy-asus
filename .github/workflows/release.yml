name: Release build

# Build release packages on GitHub-hosted runners, record what was built, and publish
# nothing (#258, step 1). The signer on the build host, bin/release-sign (step 2), checks
# GitHub's record of a run (this workflow, dispatched on main, succeeded, the artifacts'
# digests, SHA256SUMS and attestations) before it hands the files to bin/publish; nothing
# runs it yet, so nothing reads these artifacts.
#
#   plan     ci/release-plan: main only, the rc channel only (Quattro is frozen, #309),
#            no linux-omarchy (its release build will run on the build host's runner),
#            no held recipe (recipes/<r>/HOLD), the release cohorts' recipes agree
#   build    one job per recipe: ci/build-recipe --release in the container the PR check
#            uses (build-pr.yml), with the channel's package sources (ci/setup-arch
#            --channel) and the release chroot's packager.
#            Uploads release-<channel>-<recipe>: the packages (no -debug ones) and their
#            SHA256SUMS. Read-only token, kept out of the build step; no secret.
#   eligibility  ci/release-eligibility: the daily rebase's decision for these recipes
#            (bin/check-upstream against the channel's upstream dbs and published db, then
#            bin/auto-update-state plan); only build or current passes
#   check    ci/release-check on the artifacts: manifests, pkgrel range, release cohorts
#            against the channel's published db, one file per name on every release
#   nvidia-compat  when nvidia-open-dkms builds: its reverse-dependency check against the
#            channel's published linux-omarchy-headers (ci/nvidia-compat)
#   attest   build-provenance attestations for every package (actions/attest-build-provenance).
#            The only job with id-token: write and attestations: write; it runs no recipe
#            code (no checkout, no container), only checks the manifests and attests.
#   result   one status for the run: every job above passed
#
# No signing key, no publish, no release upload: tests/ci/release-workflow.sh and
# tests/ci/build-recipe-no-secrets.sh keep it that way. docs/releases.md "Release builds".
on:
  workflow_dispatch:
    inputs:
      recipes:
        description: "Space-separated recipe directories to build (not linux-omarchy)."
        required: true
      channel:
        description: "Release channel (rc only for now: Quattro is frozen, #309)."
        type: choice
        options: [rc, quattro]
        default: rc

concurrency:
  group: release-${{ github.event.inputs.channel }}
  cancel-in-progress: false

permissions: {}

env:
  BUILDER_IMAGE: ghcr.io/archlinux/archlinux:base-devel

jobs:
  plan:
    # The guard: ci/release-plan fails the run on any ref but main, saying why, and every
    # later job is skipped off main by its own if (tests/ci/release-workflow.sh checks both).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      recipes: ${{ steps.plan.outputs.recipes }}
      channel: ${{ steps.plan.outputs.channel }}
      nvidia: ${{ steps.plan.outputs.nvidia }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          REF: ${{ github.ref }}
          CHANNEL: ${{ github.event.inputs.channel }}
          REQUESTED: ${{ github.event.inputs.recipes }}
        run: |
          set -euo pipefail
          ci/release-plan "$REF" "$CHANNEL" "$REQUESTED" | tee -a "$GITHUB_OUTPUT"
          {
            echo "### Release build plan (nothing is published)"
            echo
            echo "- commit: $GITHUB_SHA"
            sed 's/^/- /' "$GITHUB_OUTPUT" | grep -E '^- (channel|recipes)='
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: github.ref == 'refs/heads/main'
    name: build (${{ matrix.recipe }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.plan.outputs.recipes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No -e/--env, no docker socket: the container holds no credentials
      # (ci/build-recipe header, tests/ci/build-recipe-no-secrets.sh).
      - name: Build ${{ matrix.recipe }}
        env:
          RECIPE: ${{ matrix.recipe }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm -v "$PWD:/repo:ro" -v "$PWD/out:/out" "$BUILDER_IMAGE" /repo/ci/build-recipe --channel "$CHANNEL" --release "$RECIPE"
          ls -l out
      # -debug packages are not published (as in the PR check): moved out before the
      # manifest, so the artifact and SHA256SUMS hold the same files.
      - name: Record SHA-256 of ${{ matrix.recipe }}
        env:
          RECIPE: ${{ matrix.recipe }}
        run: |
          set -euo pipefail
          mkdir -p debug
          shopt -s nullglob
          for f in out/*-debug-*.pkg.tar.zst; do mv -- "$f" debug/; done
          pkgs=(out/*.pkg.tar.zst)
          (( ${#pkgs[@]} )) || { echo "::error::$RECIPE built no packages to release"; exit 1; }
          (cd out && sha256sum -- *.pkg.tar.zst > SHA256SUMS)
          { echo "### $RECIPE"; echo; echo '```'; cat out/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload packages (unsigned) and SHA256SUMS
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.plan.outputs.channel }}-${{ matrix.recipe }}
          path: |
            out/*.pkg.tar.zst
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # The daily rebase's own decision for these recipes (bin/check-upstream, then
  # bin/auto-update-state plan): only build or current passes. check-upstream runs
  # `makepkg --printsrcinfo` (recipe code) in bin/recipe-sandbox, whose bubblewrap needs user
  # namespaces and its own /proc in the container: hence the sysctl (Ubuntu restricts them
  # through AppArmor) and the security options. The container holds no token or secret.
  eligibility:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Let bubblewrap make user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Would the daily rebase build these recipes now?
        env:
          RECIPES: ${{ needs.plan.outputs.recipes }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          set -euo pipefail
          mapfile -t recipes < <(jq -r '.[]' <<<"$RECIPES")
          docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined \
            -v "$PWD:/repo:ro" "$BUILDER_IMAGE" /repo/ci/release-eligibility --channel "$CHANNEL" "${recipes[@]}"

  check:
    needs: [plan, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # the releases' asset lists (one file per name)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-${{ needs.plan.outputs.channel }}-*
          path: pkgs
      - name: Install bsdtar
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libarchive-tools
      - name: Release checks (pkgrel, cohorts, one file per name)
        env:
          CHANNEL: ${{ needs.plan.outputs.channel }}
          GH_TOKEN: ${{ github.token }}
        run: ci/release-check --channel "$CHANNEL" pkgs

  nvidia-compat:
    needs: [plan, build]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.nvidia == 'true'
    name: nvidia-open-dkms vs linux-omarchy-headers
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.plan.outputs.channel }}-nvidia-open-dkms
          path: pkgs
      # The headers come from the channel's published release (signature-verified).
      - name: dkms build nvidia against linux-omarchy-headers
        env:
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          ls -l pkgs
          docker run --rm -v "$PWD:/repo:ro" -v "$PWD/pkgs:/pkgs:ro" "$BUILDER_IMAGE" /repo/ci/nvidia-compat --channel "$CHANNEL" /pkgs

  attest:
    needs: [plan, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The only job that can sign anything with GitHub's identity: no checkout, no
    # container, no recipe code. The digests are computed here, from the uploaded files.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-${{ needs.plan.outputs.channel }}-*
          path: pkgs
      # download-artifact puts each artifact in pkgs/<artifact>/ only when the pattern
      # matches more than one; a single match is extracted straight into pkgs/. Give that one
      # its own directory too, then check every artifact against its own SHA256SUMS.
      - name: One directory per artifact, checked against its SHA256SUMS
        env:
          CHANNEL: ${{ needs.plan.outputs.channel }}
          RECIPES: ${{ needs.plan.outputs.recipes }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mapfile -t recipes < <(jq -r '.[]' <<<"$RECIPES")
          if [[ -e pkgs/SHA256SUMS ]]; then
            (( ${#recipes[@]} == 1 )) || { echo "::error::one artifact downloaded for ${#recipes[@]} recipes"; exit 1; }
            d=pkgs/release-$CHANNEL-${recipes[0]}
            mkdir -- "$d"
            mv -- pkgs/SHA256SUMS pkgs/*.pkg.tar.zst "$d/"
          fi
          loose=(pkgs/*.pkg.tar.zst)
          (( ${#loose[@]} == 0 )) || { echo "::error::packages outside an artifact directory: ${loose[*]}"; exit 1; }
          sums=(pkgs/*/SHA256SUMS)
          (( ${#sums[@]} )) || { echo "::error::no SHA256SUMS under pkgs: nothing was downloaded"; exit 1; }
          dirs=(pkgs/*/)
          (( ${#dirs[@]} == ${#recipes[@]} && ${#sums[@]} == ${#recipes[@]} )) ||
            { echo "::error::${#recipes[@]} recipes planned, ${#dirs[@]} artifacts downloaded, ${#sums[@]} with SHA256SUMS"; exit 1; }
          for s in "${sums[@]}"; do
            d=${s%/SHA256SUMS}
            (cd "$d" && sha256sum --strict -c SHA256SUMS)
            listed=$(awk '{sub(/^\*/, "", $2); print $2}' "$s" | sort)
            here=$(cd "$d" && printf '%s\n' *.pkg.tar.zst | sort)
            [[ -n $here && $listed == "$here" ]] || { echo "::error::$d: SHA256SUMS does not list exactly its packages"; exit 1; }
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: pkgs/*/*.pkg.tar.zst

  result:
    needs: [plan, eligibility, build, check, nvidia-compat, attest]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          ELIGIBILITY: ${{ needs.eligibility.result }}
          BUILD: ${{ needs.build.result }}
          CHECK: ${{ needs.check.result }}
          NVIDIA: ${{ needs.nvidia-compat.result }}
          ATTEST: ${{ needs.attest.result }}
        run: |
          echo "plan=$PLAN eligibility=$ELIGIBILITY build=$BUILD check=$CHECK nvidia-compat=$NVIDIA attest=$ATTEST"
          for r in "$PLAN" "$ELIGIBILITY" "$BUILD" "$CHECK" "$ATTEST"; do
            [[ $r == success ]] || { echo "::error::a release build job did not pass (nothing is published either way)"; exit 1; }
          done
          [[ $NVIDIA == success || $NVIDIA == skipped ]] || { echo "::error::the nvidia-open-dkms reverse-dependency check did not pass"; exit 1; }
